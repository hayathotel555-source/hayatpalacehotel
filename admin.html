<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Admin Bookings | Hayat Palace Hotel</title><link rel="stylesheet" href="styles.css" /></head><body><header class="site-header"><div class="container nav-wrap"><a href="index.html" class="brand"><div class="brand-mark">HP</div><div><strong>HAYAT PALACE</strong><small>BOOKING ADMIN</small></div></a></div></header><main><section class="section"><div class="container"><div class="section-heading"><p class="eyebrow gold">Private Dashboard</p><h1>Booking management</h1></div><div class="enquiry-card" id="loginPanel"><h3>Admin login</h3><form id="loginForm"><label>Username<input id="adminUsername" required /></label><label>Password<input id="adminPassword" type="password" required /></label><button class="btn btn-primary" type="submit">Sign in</button></form></div><div class="enquiry-card" id="bookingPanel" hidden><div style="display:flex;justify-content:space-between;gap:16px;align-items:center"><h3>Reservation enquiries</h3><button class="btn btn-secondary" id="logout">Log out</button></div><div style="overflow:auto"><table id="bookingsTable" style="width:100%;border-collapse:collapse"><thead><tr><th>Reference</th><th>Guest</th><th>Stay</th><th>Room</th><th>Status</th><th>Action</th></tr></thead><tbody></tbody></table></div></div></div></section></main><script>
const tokenKey="hayatAdminToken"; const api=(path,options={})=>fetch(path,{...options,headers:{"Content-Type":"application/json",Authorization:`Bearer ${localStorage.getItem(tokenKey)}`,...options.headers}});
async function loadBookings(){const response=await api("/api/admin/bookings");if(!response.ok){localStorage.removeItem(tokenKey);showLogin();return}const {bookings}=await response.json();document.querySelector("#bookingsTable tbody").innerHTML=bookings.map(b=>`<tr><td>${b.reference}</td><td>${b.name}<br>${b.phone}</td><td>${b.checkin}<br>${b.checkout}</td><td>${b.room}</td><td><select data-ref="${b.reference}" class="status"><option ${b.status==="pending"?"selected":""}>pending</option><option ${b.status==="confirmed"?"selected":""}>confirmed</option><option ${b.status==="cancelled"?"selected":""}>cancelled</option><option ${b.status==="completed"?"selected":""}>completed</option></select></td><td>PKR ${Number(b.estimated_total).toLocaleString()}</td></tr>`).join("");document.querySelectorAll(".status").forEach(el=>el.addEventListener("change",async e=>{await api(`/api/admin/bookings/${e.target.dataset.ref}`,{method:"PATCH",body:JSON.stringify({status:e.target.value})})}))}
function showLogin(){document.getElementById("loginPanel").hidden=false;document.getElementById("bookingPanel").hidden=true}function showBookings(){document.getElementById("loginPanel").hidden=true;document.getElementById("bookingPanel").hidden=false;loadBookings()}document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:adminUsername.value,password:adminPassword.value})});const data=await r.json();if(!r.ok)return alert(data.error);localStorage.setItem(tokenKey,data.token);showBookings()});document.getElementById("logout").addEventListener("click",()=>{localStorage.removeItem(tokenKey);showLogin()});localStorage.getItem(tokenKey)?showBookings():showLogin();</script></body></html>
